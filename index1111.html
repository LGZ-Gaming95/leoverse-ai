  <style>
    /* PWA Splash Screen */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    .splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 30%;
      margin-bottom: 24px;
      animation: pulse-glow 2s ease-in-out infinite;
    }
    .splash-title {
      font-family: 'Ubuntu', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .splash-tagline {
      font-family: 'Ubuntu', sans-serif;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.1em;
      margin-bottom: 32px;
      text-align: center;
    }
    .splash-progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .splash-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6 0%, #d946ef 100%);
      border-radius: 2px;
      animation: progress-fill 2.5s ease-out forwards;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
      50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.8); }
    }
    @keyframes progress-fill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>

  <body>
    <div class="splash-screen" id="splash">
      <img 
        src="/icon-512.png" 
        alt="Leoverse AI" 
        class="splash-logo"
      />
      <div class="splash-title">Leoverse AI</div>
      <div class="splash-tagline">Powering The Next Generation</div>
      <div class="splash-progress-container">
        <div class="splash-progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash screen as soon as progress bar animation ends
      var progressBar = document.querySelector('.splash-progress-bar');
      if (progressBar) {
        progressBar.addEventListener('animationend', function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() {
              splash.remove();
            }, 500);
          }
        });
      }
    </script>
  </body>
